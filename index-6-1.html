<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Level Test</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d2238; --ink2:#16365a; --sky:#4cb7ff; --sky-soft:#dff2ff; --paper:#f7fbff;
  --ok:#1f9d6b; --bad:#e2574c; --line:#cfe3f3; --muted:#5b7390;
  --head:'Bricolage Grotesque','Trebuchet MS',sans-serif; --body:'Figtree','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.5}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-family:var(--head);font-weight:800;font-size:18px;cursor:pointer}
.chip{background:var(--sky-soft);color:var(--ink2);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700}
.hero{background:var(--ink);color:#fff;border-radius:28px;padding:44px 28px 36px;position:relative;overflow:hidden}
.hero h1{font-family:var(--head);font-weight:800;font-size:clamp(36px,8vw,64px);line-height:1;letter-spacing:-1px}
.hero p{margin-top:12px;font-size:19px;color:#b9d6ee}
.hero svg{position:absolute;right:-20px;top:-10px;width:170px;opacity:.9}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
@media(max-width:560px){.cards{grid-template-columns:1fr}.hero svg{width:110px}}
.card{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;text-align:left;transition:.15s}
.card:hover{border-color:var(--sky);transform:translateY(-2px)}
.card b{font-family:var(--head);font-size:21px;display:block}
.card span{color:var(--muted);font-size:15px}
.card .ic{font-size:26px;display:block;margin-bottom:6px}
.btn{background:var(--sky);color:var(--ink);border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:17px}
.btn:hover{filter:brightness(1.07)}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.big{width:100%;padding:18px;font-size:20px;font-family:var(--head)}
.btn:disabled{opacity:.45;cursor:not-allowed}
h2{font-family:var(--head);font-size:30px;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:16px}
.levels{display:grid;gap:10px;margin:14px 0}
.lv{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;width:100%}
.lv:hover{border-color:var(--sky)}
.lv.on{border-color:var(--ink);background:var(--sky-soft)}
.lv .code{font-family:var(--head);font-weight:800;font-size:22px;min-width:46px}
.lv small{color:var(--muted);display:block}
.panel{background:#fff;border:2px solid var(--line);border-radius:22px;padding:22px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--sky);transition:width .25s}
.q{font-family:var(--head);font-size:24px;line-height:1.25;margin:6px 0 16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:9px;font-size:17px}
.opt b{background:var(--sky-soft);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt.sel{border-color:var(--ink);background:var(--sky-soft)}
.opt.ok{border-color:var(--ok);background:#e6f7ef}
.opt.no{border-color:var(--bad);background:#fdeceb}
.fb{margin:8px 0 14px;font-weight:700}
textarea{width:100%;min-height:220px;border:2px solid var(--line);border-radius:14px;padding:14px;font:17px/1.5 var(--body);resize:vertical}
input.gap{border:0;border-bottom:3px solid var(--sky);background:var(--sky-soft);border-radius:6px 6px 0 0;font:inherit;font-weight:700;width:110px;padding:2px 6px;text-align:center;color:var(--ink)}
input.gap.ok{border-color:var(--ok);background:#e6f7ef}
input.gap.no{border-color:var(--bad);background:#fdeceb}
.line{font-size:19px;margin:14px 0;line-height:2}
.timer{font-family:var(--head);font-size:28px;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big-result{font-family:var(--head);font-weight:800;font-size:84px;line-height:1;color:var(--ink)}
.metric{margin:10px 0}
.metric div:first-child{display:flex;justify-content:space-between;font-weight:700}
.note{background:var(--sky-soft);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.rec{width:74px;height:74px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-size:30px}
.rec.live{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(226,87,76,.2)}}
@media(prefers-reduced-motion:reduce){.rec.live{animation:none}.card:hover{transform:none}}
audio{width:100%;margin:8px 0}
.song{background:var(--ink);color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.song audio{filter:invert(.9) hue-rotate(180deg)}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" onclick="go('home')">English Level Test</div>
    <div class="chip" id="levelChip" style="display:none"></div>
  </div>
  <div id="app"></div>
</div>

<script>
/* ============================================================
   1) CONTENT  —  everything you may want to edit is here
   ============================================================ */
const LEVELS = [
  {id:'A1', name:'Beginner',            hint:'First words and simple sentences'},
  {id:'A2', name:'Elementary',          hint:'Everyday situations, past and future'},
  {id:'B1', name:'Intermediate',        hint:'Opinions, plans, and experiences'},
  {id:'B2', name:'Upper-Intermediate',  hint:'Complex ideas and fluent talk'},
  {id:'C1', name:'Advanced',            hint:'Natural, precise, flexible English'}
];
const ORDER = LEVELS.map(l => l.id);

/* Grammar bank: [question, [A,B,C,D], correctIndex]  — 8 per level */
const GRAMMAR = {
A1:[
 ["She ___ a student.",["is","are","am","be"],0],
 ["I ___ coffee every day.",["drink","drinks","drinking","drank"],0],
 ["There ___ two books on the table.",["is","are","am","be"],1],
 ["___ you like pizza?",["Do","Does","Are","Is"],0],
 ["This is ___ apple.",["a","an","the","—"],1],
 ["He ___ a car.",["have","has","having","haves"],1],
 ["We ___ at home now.",["is","are","am","be"],1],
 ["___ is your name?",["What","Where","Who","When"],0]],
A2:[
 ["I ___ to the cinema yesterday.",["go","went","gone","going"],1],
 ["She is ___ than her sister.",["tall","taller","tallest","more tall"],1],
 ["We ___ watching TV at 8 last night.",["was","were","are","is"],1],
 ["I'm going to ___ my grandma tomorrow.",["visit","visiting","visited","visits"],0],
 ["How ___ water do you drink?",["many","much","few","lot"],1],
 ["He can ___ very well.",["swim","swims","swimming","to swim"],0],
 ["You ___ smoke here. It's forbidden.",["mustn't","don't have to","needn't","may"],0],
 ["I have lived here ___ 2010.",["for","since","from","during"],1]],
B1:[
 ["If it rains, we ___ at home.",["stay","will stay","would stay","stayed"],1],
 ["I have known him ___ five years.",["since","for","during","from"],1],
 ["The book ___ by millions of people.",["read","is read","reads","has reading"],1],
 ["She asked me where ___.",["I lived","did I live","I living","do I lived"],0],
 ["He used to ___ football when he was young.",["play","playing","played","plays"],0],
 ["I'm not used to ___ up early.",["get","getting","got","gets"],1],
 ["You ___ better see a doctor.",["had","would","should","did"],0],
 ["The man ___ lives next door is a doctor.",["who","which","whose","where"],0]],
B2:[
 ["If I ___ more time, I would learn Spanish.",["have","had","would have","will have"],1],
 ["By the time we arrived, the film ___.",["started","has started","had started","was starting"],2],
 ["I wish I ___ taller.",["am","was","were","will be"],2],
 ["She suggested ___ to the museum.",["to go","going","go","went"],1],
 ["He denied ___ the window.",["break","to break","breaking","broke"],2],
 ["Not only ___ late, but he also forgot the documents.",["he was","was he","he is","is he"],1],
 ["I'd rather you ___ here.",["didn't smoke","don't smoke","wouldn't smoke","not smoke"],0],
 ["She looks tired. She ___ all night.",["must have worked","must work","can have work","should work"],0]],
C1:[
 ["Had I known about the delay, I ___ earlier.",["would leave","would have left","had left","will leave"],1],
 ["Hardly ___ the room when the phone rang.",["he entered","had he entered","he had entered","did he enter"],1],
 ["The proposal, ___ was widely criticised, was withdrawn.",["which","what","that","who"],0],
 ["It's high time we ___ a decision.",["make","made","will make","are making"],1],
 ["She is said ___ the first woman to climb it.",["to be","being","to have been","that she"],2],
 ["Were it not for your help, I ___ failed.",["would have","would","will have","had"],0],
 ["No sooner had she sat down ___ the bell rang.",["than","when","that","then"],0],
 ["I'd sooner you ___ nothing about it.",["say","said","would say","had say"],1]]
};

const WRITING_TOPICS = {
 A1:["Describe your best friend.","Write about your family.","What do you do every day?"],
 A2:["Write about your last holiday.","Describe your home town.","What did you do last weekend?"],
 B1:["Write about a person who inspired you and explain why.","Describe a problem you solved and what you learned.","What are your plans for the next five years?"],
 B2:["Should students use phones at school? Give your opinion.","Is working from home better than working in an office?","Describe a change that improved your life."],
 C1:["To what extent does social media shape the way people think?","Is technology making us more or less independent?","Discuss whether success depends more on talent or on persistence."]
};
const SPEAKING_Q = {
 A1:["Tell me about yourself.","What is your favourite food?","Describe your family."],
 A2:["What did you do yesterday?","Describe your house.","What do you like to do on weekends?"],
 B1:["Tell me about a trip you remember well.","What are the good and bad sides of living in a city?","Describe a teacher who helped you."],
 B2:["Do you think learning English is important for your future? Why?","Describe a time you had to make a hard decision.","How has technology changed education?"],
 C1:["How should society balance technology and privacy?","Talk about a challenge that changed your point of view.","What makes a leader truly effective?"]
};

/* LISTENING — songs.
   Put the 4 song files in the SAME folder as this html file and rename them to:
     love-me-not.m4a, beauty-and-a-beat.m4a, the-one-that-got-away.m4a, self-aware.m4a
   For a gap-fill task made from a song, listen and write lines yourself in "lines":
     lines:[ ["line with ___ and ___", ["word1","word2"]], ... ]   (use ___ for each missing word)
   Songs with empty "lines" use the level sentences below (the "Read aloud" button reads them). */
const SONGS = [
 {id:'love',  title:'Love Me Not',        file:'love-me-not.m4a',            lines:[]},

];
const LISTENING = {
  A1: [
    ["The cat _ on the _.", ["sits", "chair"]],
    ["I _ milk every _.", ["drink", "morning"]],
    ["My _ is very _.", ["mother", "kind"]],
    ["We _ to _ at eight.", ["go", "school"]],
    ["She has a _ _.", ["red", "bag"]]
  ],

  A2: [
    ["Yesterday we _ to the _.", ["went", "market"]],
    ["He is _ than his _.", ["taller", "brother"]],
    ["I _ my keys on the _.", ["left", "table"]],
    ["They are _ a _ tomorrow.", ["having", "party"]],
    ["She _ a letter last _.", ["wrote", "week"]]
  ],

  B1: [
    ["If it _ tomorrow, we will _ home.", ["rains", "stay"]],
    ["I have _ here for _ years.", ["worked", "three"]],
    ["The _ was _ by a famous artist.", ["painting", "made"]],
    ["He _ to play the _ as a child.", ["used", "guitar"]],
    ["You _ better _ some rest.", ["had", "take"]]
  ],

  B2: [
    ["If I _ rich, I would _ the world.", ["were", "travel"]],
    ["By the time we _, the show had _.", ["arrived", "started"]],
    ["She _ going to the _ alone.", ["suggested", "museum"]],
    ["He _ taking the _.", ["denied", "money"]],
    ["They must have _ all _.", ["worked", "night"]]
  ],

  C1: [
    ["Had I _ earlier, I would have _ it.", ["known", "prevented"]],
    ["Hardly had she _ when the _ rang.", ["left", "phone"]],
    ["It is high _ we _ a decision.", ["time", "made"]],
    ["She is said to have _ the _.", ["won", "prize"]],
    ["No _ had he _ than it began.", ["sooner", "spoken"]]
  ],

  // 🎵 MUSIC LISTENING
  MUSIC: {
    title: "Love Me Not",
    artist: "Ravyn Lenae",
    audio: "love-me-not.mp3",

    lyrics: [
      "________",
      "________",
      "________",
      "________",
      "________",
      "________"
    ]
  }
};

/* ============================================================
   2) STATE + HELPERS
   ============================================================ */
const app = document.getElementById('app');
const S = {level:null, mode:'level', page:'home'};
const $ = (s,r=document)=>r.querySelector(s);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const lvName = id => { const l=LEVELS.find(x=>x.id===id); return l?`${l.id} · ${l.name}`:id; };
let timerId=null, recorder=null, recog=null, stream=null;

function stopAll(){
  clearInterval(timerId); timerId=null;
  try{ recog && recog.stop(); }catch(e){}
  try{ recorder && recorder.state!=='inactive' && recorder.stop(); }catch(e){}
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  speechSynthesis && speechSynthesis.cancel();
}
function go(page){
  stopAll(); S.page=page;
  const chip=$('#levelChip');
  if(S.level){chip.style.display='block';chip.textContent=lvName(S.level)} else chip.style.display='none';
  ({home,levelPick,grammar,writing,speaking,listening})[page]();
  window.scrollTo(0,0);
}

/* ============================================================
   3) PAGES
   ============================================================ */
function home(){
  app.innerHTML=`
  <section class="hero">
    <svg viewBox="0 0 120 120" aria-hidden="true"><path d="M20 80c10-30 40-50 80-45-12 6-20 14-24 24 10-2 18 0 24 4-20 4-30 14-34 30-8-10-18-14-30-12 4-6 8-10 14-12-12-2-22 2-30 11z" fill="#4cb7ff"/></svg>
    <h1>ENGLISH LEVEL TEST</h1>
    <p>Find your real English level</p>
  </section>
  <div class="cards">
    <button class="card" onclick="start('grammar')"><span class="ic">📝</span><b>Grammar</b><span>Test your grammar</span></button>
    <button class="card" onclick="start('writing')"><span class="ic">✍️</span><b>Writing</b><span>Show your writing skills</span></button>
    <button class="card" onclick="start('speaking')"><span class="ic">🎤</span><b>Speaking</b><span>Test your speaking</span></button>
    <button class="card" onclick="start('listening')"><span class="ic">🎧</span><b>Listening</b><span>Listen and complete</span></button>
  </div>
  <button class="btn big dark" onclick="start(null)">🚀 START TEST</button>`;
}

/* Choose a section from home -> need level first */
function start(section){ S.next=section; levelPick(); }

function levelPick(){
  S.page='levelPick';
  app.innerHTML=`
  <h2>Choose your level</h2>
  <p class="sub">Every section will match the level you select.</p>
  <div class="levels">
   ${LEVELS.map(l=>`<button class="lv ${S.level===l.id?'on':''}" onclick="setLevel('${l.id}')">
      <span class="code">${l.id}</span><span><b>${l.name}</b><small>${l.hint}</small></span></button>`).join('')}
   <button class="lv ${S.level==='ALL'?'on':''}" onclick="setLevel('ALL')">
      <span class="code">?</span><span><b>I don't know my level</b><small>Mixed grammar test, easy to hard — finds your level</small></span></button>
  </div>
  <p class="sub" style="margin-top:18px">Where to start?</p>
  <div class="row">
    ${[['grammar','📝 Grammar'],['writing','✍️ Writing'],['speaking','🎤 Speaking'],['listening','🎧 Listening']]
      .map(([k,t])=>`<button class="btn ${S.next===k?'dark':'ghost'}" onclick="S.next='${k}';levelPick()">${t}</button>`).join('')}
  </div>
  <div style="margin-top:20px"><button class="btn big" ${S.level?'':'disabled'} onclick="beginSection()">Continue</button></div>`;
}
function setLevel(id){ S.level=id; levelPick(); }
function beginSection(){
  if(!S.level) return;
  const lv = S.level==='ALL' ? 'B1' : S.level;           // writing/speaking/listening need a real level
  if(S.level==='ALL' && S.next && S.next!=='grammar'){ S.level=null; levelPick(); alert('For this section please choose a level first.'); return; }
  go(S.next||'grammar');
}
function lvl(){ return S.level==='ALL'?'B1':S.level; }

/* ---------- GRAMMAR ---------- */
function grammar(){
  let qs;
  if(S.level==='ALL'){ qs=[]; ORDER.forEach(id=>{ shuffle(GRAMMAR[id]).slice(0,4).forEach(q=>qs.push({q,lv:id})) }); }
  else qs=shuffle(GRAMMAR[S.level]).map(q=>({q,lv:S.level}));
  const G={qs,i:0,score:0,byLv:{},locked:false};
  ORDER.forEach(id=>G.byLv[id]={ok:0,n:0});
  window.G=G; renderQ();
}
function renderQ(){
  const G=window.G, cur=G.qs[G.i], [text,opts]=cur.q, L='ABCD';
  app.innerHTML=`
  <div class="panel">
   <div class="bar"><i style="width:${G.i/G.qs.length*100}%"></i></div>
   <div class="sub">Question ${G.i+1} of ${G.qs.length}</div>
   <div class="q">${text}</div>
   ${opts.map((o,k)=>`<button class="opt" onclick="answer(${k})"><b>${L[k]}</b>${o}</button>`).join('')}
   <div class="fb" id="fb"></div>
   <button class="btn" id="nx" style="display:none" onclick="nextQ()">${G.i+1===G.qs.length?'See result':'Next'}</button>
  </div>`;
}
function answer(k){
  const G=window.G; if(G.locked) return; G.locked=true;
  const cur=G.qs[G.i], right=cur.q[2], btns=[...document.querySelectorAll('.opt')];
  btns.forEach(b=>b.disabled=true);
  btns[k].classList.add('sel');
  cur.pick=k;
  G.byLv[cur.lv].n++;
  if(k===right){G.score++;G.byLv[cur.lv].ok++;}
  $('#fb').textContent='Answer saved.';
  $('#nx').style.display='inline-block';
}
function nextQ(){ const G=window.G; G.locked=false; G.i++; G.i<G.qs.length?renderQ():grammarResult(); }
function grammarResult(){
  const G=window.G, n=G.qs.length; let res, msg;
  if(S.level==='ALL'){
    // highest level where >=3 of 4 correct; stop at first failed level
    let best='A1', passedAll=true;
    for(const id of ORDER){ const r=G.byLv[id]; if(r.ok>=3 && passedAll) best=id; else passedAll=false; }
    if(G.byLv.A1.ok<2) best='A1';
    res=best; msg='Estimated from a mixed test of '+n+' questions.';
  } else {
    const i=ORDER.indexOf(S.level), pct=G.score/n;
    if(pct>=.875){res=ORDER[Math.min(i+1,4)]; msg= i<4?`Excellent! You are strong at ${S.level} — you may be ready for ${res}.`:'Excellent! You are at the top level.';}
    else if(pct>=.6){res=S.level; msg=`You are at ${S.level}. Keep practising to reach the next level.`;}
    else {res=ORDER[Math.max(i-1,0)]; msg=`This level looks hard for now. Your level may be nearer to ${res}.`;}
  }
  app.innerHTML=`<div class="panel" style="text-align:center">
   <div class="sub">Grammar result</div>
   <div class="big-result">${res}</div>
   <h2>${G.score} / ${n} correct</h2>
   <p class="sub">${msg}</p>
   <div class="row" style="justify-content:center"><button class="btn" onclick="go('grammar')">Try again</button>
   <button class="btn dark" onclick="S.next='writing';go('writing')">Next: Writing</button>
   <button class="btn ghost" onclick="levelPick()">Change level</button></div>
   <div style="text-align:left;margin-top:22px"><h2 style="font-size:22px">Your answers</h2>
   ${G.qs.map((c,n)=>{ const [t,o,r]=c.q, good=c.pick===r;
     return `<div class="note" style="border-left:6px solid ${good?'var(--ok)':'var(--bad)'}">
       <b>${n+1}. ${t}</b><br>
       ${good?'✅':'❌'} Your answer: ${'ABCD'[c.pick]}) ${o[c.pick]}
       ${good?'':`<br>✔ Correct: ${'ABCD'[r]}) ${o[r]}`}</div>`; }).join('')}
   </div></div>`;
}

/* ---------- WRITING ---------- */
function writing(){
  const topic=pick(WRITING_TOPICS[lvl()]); let left=10*60;
  app.innerHTML=`<div class="panel">
   <div class="row" style="justify-content:space-between"><h2>Writing</h2><div class="timer" id="tm">10:00</div></div>
   <div class="note"><b>Topic:</b> ${topic}</div>
   <p class="sub">Write 5–10 minutes. Aim for ${{A1:'30–50',A2:'60–90',B1:'100–150',B2:'150–200',C1:'200–250'}[lvl()]} words.</p>
   <textarea id="wt" placeholder="Start writing here..."></textarea>
   <div class="row" style="margin-top:12px;justify-content:space-between"><span id="wc" class="sub">0 words</span>
   <button class="btn" id="chk">Check my writing</button></div></div>`;
  const wt=$('#wt');
  wt.oninput=()=>$('#wc').textContent=(wt.value.trim().split(/\s+/).filter(Boolean).length)+' words';
  const tick=()=>{ const m=String(Math.floor(left/60)).padStart(2,'0'), s=String(left%60).padStart(2,'0'); $('#tm').textContent=m+':'+s; if(left--<=0){clearInterval(timerId);evalWriting(wt.value)} };
  tick(); timerId=setInterval(tick,1000);
  $('#chk').onclick=()=>{clearInterval(timerId);evalWriting(wt.value)};
}
const MISSPELL={recieve:'receive',definately:'definitely',teh:'the',becuase:'because',becouse:'because',freind:'friend',frend:'friend',wich:'which',alot:'a lot',beleive:'believe',occured:'occurred',seperate:'separate',tomorow:'tomorrow',diffrent:'different',beutiful:'beautiful',peaple:'people',peple:'people',realy:'really',goverment:'government',enviroment:'environment',intresting:'interesting',importent:'important',wensday:'Wednesday',excersize:'exercise',sucess:'success',thier:'their'};
const CONNECT=['however','because','although','while','therefore','moreover','furthermore','besides','whereas','despite','in addition','on the other hand','for example','as a result','nevertheless','so','but','and then','firstly','finally','if'];
function cefrFromScore(s){ return s>=85?'C1':s>=68?'B2':s>=50?'B1':s>=30?'A2':'A1'; }
function metricHTML(name,val){ return `<div class="metric"><div><span>${name}</span><span>${Math.round(val)}%</span></div><div class="bar" style="margin:4px 0 0"><i style="width:${val}%"></i></div></div>`; }
function textStats(t){
  const words=(t.toLowerCase().match(/[a-z']+/g)||[]), n=words.length;
  const uniq=new Set(words).size, sents=t.split(/[.!?]+/).map(s=>s.trim()).filter(Boolean);
  const avgW=n/Math.max(sents.length,1), avgLen=words.join('').length/Math.max(n,1);
  const long=words.filter(w=>w.length>=7).length;
  const low=t.toLowerCase(); const conn=CONNECT.filter(c=>new RegExp('\\b'+c+'\\b').test(low)).length;
  return {words,n,uniq,sents,avgW,avgLen,long,conn,ttr:n?uniq/Math.sqrt(2*n):0};
}
function evalWriting(text){
  const st=textStats(text), issues=[];
  if(st.n<15){ app.innerHTML=`<div class="panel"><h2>Too short</h2><p class="sub">Please write at least 15 words so we can estimate your level.</p><button class="btn" onclick="go('writing')">Try again</button></div>`; return; }
  // spelling
  let spell=100; const found=[];
  st.words.forEach(w=>{ if(MISSPELL[w]) found.push(`${w} → ${MISSPELL[w]}`); });
  spell-=found.length*12; if(found.length) issues.push('Spelling: '+[...new Set(found)].join(', '));
  // grammar (rule-based signals)
  let gram=100;
  if(/\bi\b/.test(text)){ gram-=10; issues.push('Write "I" with a capital letter.'); }
  const badStart=st.sents.filter(s=>/^[a-z]/.test(s)).length; if(badStart){gram-=badStart*6;issues.push('Start each sentence with a capital letter.');}
  if(!/[.!?]\s*$/.test(text.trim())){gram-=6;issues.push('End your text with a full stop.');}
  const dbl=text.toLowerCase().match(/\b(\w+)\s+\1\b/g); if(dbl){gram-=dbl.length*8;issues.push('Repeated words: '+dbl.slice(0,3).join(', '));}
  if(/\b(he|she|it)\s+(have|do|go|don't)\b/i.test(text)){gram-=10;issues.push('Check subject–verb agreement (he/she/it + has, does, goes).');}
  if(/\b(more|most)\s+\w+(er|est)\b/i.test(text)){gram-=8;issues.push('Do not use "more" together with -er/-est.');}
  if(/\bpeoples\b|\binformations\b|\badvices\b/i.test(text)){gram-=8;issues.push('Some nouns are uncountable (information, advice).');}
  gram=Math.max(gram,10);
  // vocabulary
  const vocab=Math.min(100, st.ttr*55 + st.long/st.n*140 + st.avgLen*4);
  // sentence structure
  const struct=Math.min(100, Math.min(st.avgW,16)/16*55 + Math.min(st.conn,5)/5*35 + (st.sents.length>=3?10:0));
  // length bonus
  const len=Math.min(100, st.n/150*100);
  const total=(gram*.3+vocab*.25+struct*.25+len*.1+spell*.1);
  const adj=total*(Math.min(1,st.n/60)*.3+.7);
  const res=cefrFromScore(adj);
  app.innerHTML=`<div class="panel"><div class="sub" style="text-align:center">Estimated writing level</div>
   <div class="big-result" style="text-align:center">${res}</div>
   <p class="sub" style="text-align:center">${st.n} words · ${st.sents.length} sentences</p>
   ${metricHTML('Grammar',gram)}${metricHTML('Vocabulary',vocab)}${metricHTML('Spelling',spell)}${metricHTML('Sentence structure',struct)}
   ${issues.length?`<div class="note"><b>What to fix</b><br>${issues.map(i=>'• '+i).join('<br>')}</div>`:'<div class="note">No obvious mistakes found. 👏</div>'}
   <div class="note">This is an automatic estimate based on your text's patterns (no AI teacher), so use it as a guide.</div>
   <div class="row"><button class="btn" onclick="go('writing')">New topic</button><button class="btn dark" onclick="S.next='speaking';go('speaking')">Next: Speaking</button></div></div>`;
}

/* ---------- SPEAKING ---------- */
function speaking(){
  const q=pick(SPEAKING_Q[lvl()]);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  app.innerHTML=`<div class="panel"><h2>Speaking</h2>
   <div class="note"><b>Question:</b> ${q}</div>
   <p class="sub">Speak for 30–60 seconds. Allow the microphone when asked.</p>
   ${SR?'':'<div class="note">Your browser cannot transcribe speech. Use Google Chrome for full scoring.</div>'}
   <div class="row" style="margin:14px 0"><button class="rec" id="rb" aria-label="Start recording">🎙️</button><div><b id="rs">Start Recording</b><div class="sub" id="rt">0:00</div></div></div>
   <div id="live" class="sub" style="min-height:48px"></div><audio id="pl" controls style="display:none"></audio></div>`;
  let on=false, finalT='', t0=0, conf=[], chunks=[], tm;
  $('#rb').onclick=async()=>{
    if(!on){
      try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ alert('Microphone is blocked. Please allow it in the browser.'); return; }
      on=true; finalT=''; conf=[]; chunks=[]; t0=Date.now();
      $('#rb').classList.add('live'); $('#rs').textContent='Recording... tap to stop';
      recorder=new MediaRecorder(stream); recorder.ondataavailable=e=>chunks.push(e.data);
      recorder.onstop=()=>{ const a=$('#pl'); if(a){a.src=URL.createObjectURL(new Blob(chunks)); a.style.display='block';} };
      recorder.start();
      if(SR){ recog=new SR(); recog.lang='en-US'; recog.continuous=true; recog.interimResults=true;
        recog.onresult=e=>{ let interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal){finalT+=r[0].transcript+' ';conf.push(r[0].confidence);} else interim+=r[0].transcript; } $('#live').textContent=finalT+interim; };
        recog.onend=()=>{ if(on) try{recog.start()}catch(e){} };
        recog.start(); }
      tm=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#rt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500);
    } else {
      on=false; clearInterval(tm); const secs=(Date.now()-t0)/1000;
      try{recog&&recog.stop()}catch(e){} try{recorder.stop()}catch(e){}
      stream&&stream.getTracks().forEach(t=>t.stop()); stream=null;
      $('#rb').classList.remove('live'); $('#rs').textContent='Done';
      setTimeout(()=>evalSpeaking(finalT.trim(),secs,conf,!!SR),500);
    }
  };
}
function evalSpeaking(text,secs,conf,hasSR){
  const box=document.createElement('div'); document.querySelector('.panel').appendChild(box);
  if(!hasSR||text.split(/\s+/).length<8){
    box.innerHTML=`<div class="note">${hasSR?'We could not hear enough words. Speak louder and for longer, then try again.':'Listen to your recording above and compare it with the question.'}</div><button class="btn" onclick="go('speaking')">Try again</button>`; return; }
  const st=textStats(text), wpm=st.n/(secs/60);
  const fillers=(text.toLowerCase().match(/\b(um|uh|er|ah|like|you know)\b/g)||[]).length;
  const pron=conf.length?Math.min(100,(conf.reduce((a,b)=>a+b,0)/conf.length)*105):60;
  const flu=Math.max(10,Math.min(100, (Math.min(wpm,130)/130)*85 + 15 - fillers*4));
  const vocab=Math.min(100, st.ttr*55 + st.long/st.n*140 + st.avgLen*4);
  let gram=85; if(st.avgW<5) gram-=15; if(st.conn>=2) gram+=10; if(/\bi\b/.test(text)&&false) gram-=0; gram=Math.min(100,gram+Math.min(st.sents.length,5)*0);
  gram=Math.max(20,Math.min(100,gram*(Math.min(1,st.n/60)*.4+.6)));
  const total=pron*.25+flu*.3+vocab*.25+gram*.2, res=cefrFromScore(total*(Math.min(1,st.n/60)*.3+.7));
  box.innerHTML=`<hr style="border:0;border-top:2px solid var(--line);margin:16px 0">
   <div class="sub" style="text-align:center">Estimated speaking level</div><div class="big-result" style="text-align:center">${res}</div>
   ${metricHTML('Pronunciation',pron)}${metricHTML('Grammar',gram)}${metricHTML('Vocabulary',vocab)}${metricHTML('Fluency',flu)}
   <div class="note">${st.n} words · ${Math.round(wpm)} words/min · ${fillers} filler words. Pronunciation comes from the browser's speech-recognition confidence, so it is only a guide.</div>
   <div class="row"><button class="btn" onclick="go('speaking')">New question</button><button class="btn dark" onclick="S.next='listening';go('listening')">Next: Listening</button></div>`;
}

/* ---------- LISTENING ---------- */
function listening(){
  if(!S.song) S.song=SONGS[0].id;
  const song=SONGS.find(x=>x.id===S.song);
  const own=song.lines.length>0;
  const items=own?song.lines:LISTENING[lvl()];
  let total=0; items.forEach(i=>total+=i[1].length);
  const html=items.map(([sentence,ans],r)=>{
    let k=0; return `<div class="line">${sentence.replace(/___/g,()=>`<input class="gap" data-a="${ans[k]}" id="g${r}_${k++}" autocomplete="off" autocapitalize="off" spellcheck="false">`)}</div>`;
  }).join('');
  app.innerHTML=`<div class="panel"><h2>Listening</h2>
   <div class="row" style="margin-bottom:12px">${SONGS.map(x=>`<button class="btn ${x.id===song.id?'dark':'ghost'}" onclick="S.song='${x.id}';go('listening')">${x.title}</button>`).join('')}</div>
   <div class="song"><div><b>🎵 ${song.title} — Listening Test</b></div>
    <audio id="au" src="${encodeURI(song.file)}" controls preload="auto"></audio>
    <div class="ctrl"><button class="btn" id="pp">▶️ Play</button><button class="btn ghost" style="color:#fff;border-color:#4a6a8c" id="ps">⏸️ Pause</button>
    <label>🔊 <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8"></label></div>
    <div class="sub" id="auNote" style="color:#b9d6ee;margin:8px 0 0"></div></div>
   ${own?'':`<div class="note">No gap-fill lines were added for this song yet, so these are ${lvName(lvl())} practice sentences. Press "Read aloud" to hear them.</div>
   <button class="btn ghost" id="rd" style="margin-bottom:8px">🗣️ Read aloud</button>`}
   <p class="sub">Listen and type the missing words.</p>${html}
   <div class="row"><button class="btn" id="ck">Check Answers</button><button class="btn ghost" onclick="go('listening')">Reset</button></div>
   <div class="big-result" id="sc" style="font-size:44px;margin-top:14px"></div></div>`;
  const au=$('#au'); au.volume=.8;
  au.onerror=()=>{ $('#auNote').textContent='File not found: '+song.file+' — put it in the same folder as this page.'; };
  $('#pp').onclick=()=>au.play();
  $('#ps').onclick=()=>au.pause();
  $('#vol').oninput=e=>{au.volume=+e.target.value};
  const rd=$('#rd'); if(rd) rd.onclick=()=>{ au.pause(); speechSynthesis.cancel(); items.forEach(([s,a])=>{ let k=0; const u=new SpeechSynthesisUtterance(s.replace(/___/g,()=>a[k++])); u.lang='en-US'; u.rate=.85; u.volume=+$('#vol').value; speechSynthesis.speak(u); }); };
  $('#ck').onclick=()=>{
    let ok=0; document.querySelectorAll('.gap').forEach(g=>{
      const good=g.value.trim().toLowerCase()===g.dataset.a.toLowerCase();
      g.classList.remove('ok','no'); g.classList.add(good?'ok':'no'); if(good) ok++; else g.title='Correct: '+g.dataset.a;
    });
    const p=ok/total, est=p>=.9?'Great listening!':p>=.6?'Good, keep practising.':'Listen again and try once more.';
    $('#sc').innerHTML=`${ok}/${total} <span style="font-size:18px;font-weight:500;font-family:var(--body)">${est}</span>`;
  };
}

home();
</script>
</body>
</html>
